name: Beta

# 测试版：不用填任何参数，直接出一个能覆盖安装正式版的 APK。
#  - 推送到任意分支自动构建（只改文档 / 素材的推送不构建）；
#  - 也可以在 Actions 页面手动 Run workflow，在「Use workflow from」里选分支即可
#    （GitHub 只在默认分支上有这个文件之后才显示这个按钮）。
# 产物挂在这次运行的 Artifacts 里：不打 tag、不发 Release。
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'work_assets/**'
      - 'work_tables/**'

permissions:
  contents: read

# 同一分支连推几次，只留最后一次的构建。
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute beta version
        id: v
        run: |
          set -euo pipefail
          base=$(sed -n 's/^versionName=//p' gradle.properties | tr -d '[:space:]')
          case "$base" in
            *.*.*) ;;
            *) echo "::error::gradle.properties versionName '$base' is not MAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          # 与 release.yml 同一套 versionCode（MAJOR*10000 + MINOR*100 + PATCH），取「下一个补丁版本」：
          # 比当前正式版大 → 直接覆盖安装；与下一个正式版相等 → 正式版还能装回来（Android 只拦降级）。
          next="$major.$minor.$((patch + 1))"
          code=$(( major * 10000 + minor * 100 + patch + 1 ))
          sha=$(git rev-parse --short HEAD)
          name="$next-beta.${{ github.run_number }}+$sha"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Beta $name (versionCode $code)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与正式版同一把密钥：签名不同的话，测试版装不上已装正式版的手机。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Unit tests and release APK
        env:
          # 绝对路径：同 release.yml，Gradle 在 app/ 下解析相对路径会找不到。
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            "-PversionName=${{ steps.v.outputs.name }}" \
            "-PversionCode=${{ steps.v.outputs.code }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/MeiWindow-${{ steps.v.outputs.name }}.apk"

      - name: Verify LSPosed Metadata
        run: |
          set -euo pipefail
          apk=$(ls dist/*.apk)
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -qx 'com.repl.bubbledrawer.xposed.ModuleMain'
          unzip -p "$apk" META-INF/xposed/scope.list | grep -qx 'com.android.systemui'
          echo "LSPosed entry point and scope verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeiWindow-${{ steps.v.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### 魅窗测试版 ${{ steps.v.outputs.name }}"
            echo
            echo "- versionCode：${{ steps.v.outputs.code }}（可直接覆盖安装 $(sed -n 's/^versionName=//p' gradle.properties) 正式版）"
            echo "- 提交：${{ github.sha }}（${{ github.ref_name }}）"
            echo "- 下载：本页底部 Artifacts → MeiWindow-${{ steps.v.outputs.name }}（zip 里是 APK）"
          } >> "$GITHUB_STEP_SUMMARY"
